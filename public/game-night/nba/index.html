<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA · Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14; --panel:#141923; --line:#232A38; --line2:#1B212D;
  --text:#F2F4F7; --soft:#C5CBD6; --muted:#9AA3B2; --ok:#3DDC84; --warn:#F9A45C;
  --home:#FEC524; --away:#2F8FE0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
#app{min-height:100vh;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 20px}
.label{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:16px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
button,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

/* back bar */
.topbar{display:flex;align-items:center;gap:12px}
.topbar a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--soft);text-decoration:none;font-size:14px;font-weight:600;transition:border-color .15s,color .15s}
.topbar a:hover{border-color:#3a4458;color:var(--text)}
.topbar a:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.topbar .home{margin-left:auto}
.topbar h1{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.topbar h1 span{color:var(--warn)}

/* top strip */
.strip{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.strip .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex-shrink:0}
.dot.stale{background:var(--warn)}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px;font-size:14px;max-width:260px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.stepper output{min-width:44px;text-align:center;color:var(--text);font-weight:600}

/* tonight's games */
.games{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.games:empty{display:none}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:78px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 10px;touch-action:manipulation;transition:border-color .15s,background .15s,color .15s}
.day:hover{border-color:#3a4458}
.day b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.day small{font-size:11px;color:var(--muted)}
.day.past b{color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--warn);background:#1c2230;color:var(--text)}
.day[aria-pressed="true"] b{color:var(--warn)}
.nogames{font-size:14px;color:var(--muted);padding:14px 4px}
.gm{flex:0 0 auto;scroll-snap-align:start;min-width:176px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;touch-action:manipulation;transition:border-color .15s,background .15s}
.gm:hover{border-color:#3a4458}
.gm[aria-current="true"]{border-color:var(--warn);background:#1c2230;box-shadow:0 0 0 1px var(--warn) inset}
.gm .row{display:flex;align-items:center;gap:8px;font-size:15px}
.gm .row img,.gm .row .ph{width:26px;height:26px;object-fit:contain;flex-shrink:0}
.gm .row .ph{border-radius:50%;background:var(--line)}
.gm .ab{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:18px;letter-spacing:.04em}
.gm .sc{margin-left:auto;font-weight:600;font-size:17px}
.gm .row.lose .ab,.gm .row.lose .sc{color:var(--muted)}
.gm .st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.gm .st.live{color:var(--ok)}
.gm .st.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:gnpulse 1.6s ease-in-out infinite}
@keyframes gnpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.gm .st.live::before{animation:none}}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr minmax(180px,260px) 1fr;align-items:center;padding-top:10px}
.side{display:flex;align-items:center;gap:18px;min-width:0}
.side.away{flex-direction:row-reverse}
.badge{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px;color:#fff;flex-shrink:0;border:3px solid var(--line);overflow:hidden;background:#1B212D}
.badge img{width:70%;height:70%;object-fit:contain}
.tname{font-weight:600;font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.tsub{font-size:13px;color:var(--muted);margin-top:4px}
.side.away .tinfo{text-align:right}
.pts{font-weight:700;font-size:104px;line-height:1}
.side.home .pts{margin-left:auto;padding-right:24px}
.side.away .pts{margin-right:auto;padding-left:24px}
.pts.behind{color:var(--soft)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100px;text-align:center;padding:0 8px}
.period{font-weight:600;font-size:22px;color:var(--warn);letter-spacing:.08em;text-transform:uppercase}
.clock{font-weight:700;font-size:52px;line-height:1}

/* body */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.grow{flex:1}
.phead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.phead .ttl{font-weight:600;font-size:22px;letter-spacing:.06em}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.tabs button{min-height:44px;min-width:120px;border:0;border-radius:9px;font-size:15px;font-weight:600;background:transparent;color:var(--soft)}
.tabs button[aria-pressed="true"]{background:#2A3345;color:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:440px}
th{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 5px;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
td{text-align:right;padding:0 5px;height:34px;font-size:15px;border-bottom:1px solid var(--line2);color:var(--soft);white-space:nowrap}
td.n{color:var(--text);font-weight:500}
td.n small{color:var(--muted);font-weight:400;font-size:13px}
td.p{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:22px;color:var(--text)}
td.s{color:var(--text)}
td.d{width:24px;padding:0;text-align:center}
tr.bench-start td{border-top:1px solid var(--line)}
.plays{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.play{display:flex;gap:12px;font-size:15px;color:var(--muted)}
.play:first-child{color:var(--text)}
.play b{width:52px;flex-shrink:0;font-weight:600}
.play:first-child b{color:var(--warn)}
.wp{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0}
.wp span{font-weight:600;font-size:24px;line-height:1;color:var(--soft)}
.wp span.lead{font-weight:700;font-size:34px;color:var(--text)}
.bar{display:flex;gap:3px;height:12px;border-radius:6px;overflow:hidden}
.bar i,.cmp .b i{display:block;background:var(--home);transition:width .6s}
.bar i+i,.cmp .b i+i{background:var(--away);flex:1}
.cmphead{display:flex;justify-content:space-between;margin-bottom:12px}
.cmp{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.cmp .r{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.cmp .r b{font-size:17px;font-weight:400;color:var(--soft)}
.cmp .r b.w{font-weight:600;color:var(--text)}
.cmp .b{display:flex;gap:3px;height:6px}
.cmp .b i{border-radius:3px}
.leaders{border-color:var(--warn)}
.leaders .label{color:var(--warn)}
.lrow{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-top:8px}
.lrow span{color:var(--muted)}
.empty{color:var(--muted);font-size:15px;padding:16px 0}

/* score by quarter */
.lines{display:flex;justify-content:center;margin-top:14px}
.lines:empty{display:none}
.lines table{min-width:0;width:auto}
.lines th,.lines td{text-align:center;padding:0 12px;height:30px;font-size:15px}
.lines th:first-child,.lines td:first-child{text-align:left;padding-left:0}
.lines td.t{font-weight:700;color:var(--text);border-left:1px solid var(--line)}
.lines td.hi{color:var(--text);font-weight:600}
.lines .ab{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:17px;color:var(--text)}
.lines .ab img{width:22px;height:22px;object-fit:contain}
.chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:5px;background:var(--warn);color:#1a1206;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}

/* momentum */
.flow{margin-top:14px}
.flow svg{display:block;width:100%;height:96px}
.flow .q{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}

/* fouls in the player table */
td.pf.warn{color:var(--warn);font-weight:700}
td.pf.out{color:#FF6B6B;font-weight:700}

/* shot chart */
.views{margin-left:auto}
.views button{min-width:96px}
.shotwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.shotwrap svg{flex:1 1 360px;max-width:620px;max-height:62vh;display:block}
.court{fill:none;stroke:#3a4458;stroke-width:.3}
.shotside{flex:0 1 220px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--muted)}
.shotside b{color:var(--text);font-size:20px;font-weight:600;display:block}
.key{display:flex;gap:14px;align-items:center;font-size:13px}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.key i.miss{background:none;border:2px solid var(--muted);width:10px;height:10px}

/* matchup */
.mrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-top:8px}
.mrow span:first-child{color:var(--muted)}
.mrow span:last-child{text-align:right;color:var(--text)}
.inj{margin-top:12px}
.inj h4{margin:0 0 4px;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;color:var(--soft)}
.inj div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;color:var(--soft)}
.inj div span{color:var(--muted);text-align:right}
.inj .out{color:#FF8A8A}
.fine{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}

@media (max-width:980px){
  .body{grid-template-columns:1fr}
  .pts{font-size:64px}
  .tname{font-size:24px}
  .badge{width:56px;height:56px;font-size:20px}
  .clock{font-size:36px}
}
@media (max-width:640px){
  #app{padding:12px}
  .score{grid-template-columns:1fr;gap:12px}
  .mid{border:0;min-height:0;order:-1}
  .side.away{flex-direction:row}
  .side.away .tinfo{text-align:left}
  .side.away .pts{margin-left:auto;margin-right:0;padding:0}
  .side.home .pts{padding:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a href="/game-night/" aria-label="Back to all sports">← Sports</a>
    <h1><span>NBA</span> Game Night</h1>
    <a class="home" href="/">Home</a>
  </header>
  <nav class="days" id="days" aria-label="Schedule by day"></nav>
  <nav class="games" id="games" aria-label="Games on the chosen day"></nav>
  <section class="panel">
    <div class="strip">
      <div class="grp"><span class="dot" id="dot" aria-hidden="true"></span><span id="status" role="status">Connecting…</span></div>
      <div class="grp">
        <span id="venue"></span>
        <span id="delayLabel">TV delay</span>
        <div class="stepper" role="group" aria-labelledby="delayLabel">
          <button type="button" id="dMinus" aria-label="Less delay">−</button>
          <output id="dVal">0s</output>
          <button type="button" id="dPlus" aria-label="More delay">+</button>
        </div>
      </div>
    </div>
    <div class="score" id="score"></div>
    <div class="lines" id="lines"></div>
  </section>

  <div class="body">
    <div class="col">
      <section class="panel grow">
        <div class="phead">
          <div style="display:flex;align-items:center;gap:16px">
            <div class="ttl cond">PLAYERS</div>
            <div class="legend"><span class="dot" aria-hidden="true"></span>On the court now</div>
          </div>
          <div class="tabs views" id="views" role="group" aria-label="View">
            <button type="button" data-view="box" aria-pressed="true">Box score</button>
            <button type="button" data-view="shots" aria-pressed="false">Shot chart</button>
          </div>
          <div class="tabs" id="tabs"></div>
        </div>
        <div class="tablewrap" id="players"></div>
        <div id="shots" hidden></div>
      </section>
      <section class="panel">
        <div class="label">Last plays</div>
        <div class="plays" id="plays"></div>
      </section>
    </div>
    <div class="col">
      <section class="panel">
        <div class="label">Win chance</div>
        <div id="wp"></div>
        <div class="flow" id="flow"></div>
      </section>
      <section class="panel grow">
        <div id="cmp"></div>
      </section>
      <section class="panel leaders">
        <div class="label">Game leaders</div>
        <div id="leaders"></div>
      </section>
      <section class="panel">
        <div class="label">Matchup</div>
        <div id="matchup"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  var API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/';
  var qs = new URLSearchParams(location.search);
  var eventId = qs.get('event');
  var wantTeam = (qs.get('team') || '').toUpperCase();
  var side = 'away';        // which team's players are showing
  var sideChosen = false;
  var view = 'box';         // box score or shot chart
  var buffer = [];          // [{t, data}] recent snapshots, for the TV delay
  var lastOk = 0, failing = false, timer = null;
  var delay = 0;
  try { delay = parseInt(localStorage.getItem('gn-delay') || '0', 10) || 0; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hex(c) { return /^[0-9a-f]{6}$/i.test(c || '') ? '#' + c : null; }
  function lum(h) {
    var n = parseInt(h.slice(1), 16);
    return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  }
  // A team colour bright enough to read on the dark background.
  function visible(team, fallback) {
    var a = hex(team.color), b = hex(team.alternateColor);
    if (a && lum(a) > 0.28) return a;
    if (b && lum(b) > 0.28) return b;
    return fallback;
  }
  function getJSON(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  /* ---------- game list ---------- */
  /* schedule: 2 days back to 7 days ahead; 0 = today */
  var day = 0, dayCount = {};
  function dateKey(off) {
    var d = new Date(); d.setDate(d.getDate() + off);
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  }
  function dayURL(off) { return API + 'scoreboard?dates=' + dateKey(off); }
  /* On first load ask ESPN which day is "current": on a day with no games it jumps to the next game day. */
  var firstLoad = true;
  function offsetOf(iso) {
    var p = String(iso || '').split('-'); if (p.length !== 3) return 0;
    var a = new Date(+p[0], +p[1] - 1, +p[2]), t = new Date(); t.setHours(0, 0, 0, 0);
    var off = Math.round((a - t) / 86400000);
    return off >= -2 && off <= 7 ? off : 0;
  }
  function drawDays() {
    var html = '';
    for (var off = -2; off <= 7; off++) {
      var d = new Date(); d.setDate(d.getDate() + off);
      var name = off === 0 ? 'Today' : off === -1 ? 'Yesterday' : off === 1 ? 'Tomorrow' : d.toLocaleDateString([], { weekday: 'short' });
      var date = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      var n = dayCount[off];
      var sub = n == null ? date : n === 0 ? date + ' · off' : date + ' · ' + n;
      html += '<button type="button" class="day' + (off < 0 ? ' past' : '') + '" data-day="' + off + '" aria-pressed="' + (off === day) + '"' +
        ' aria-label="' + esc(name + ', ' + date + (n == null ? '' : ', ' + n + ' games')) + '"><b>' + esc(name) + '</b><small>' + esc(sub) + '</small></button>';
    }
    $('days').innerHTML = html;
  }
  function showDay() {
    var on = $('days').querySelector('[aria-pressed="true"]');
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  /* game counts for every day in the row (one light request per day, once) */
  function countDays() {
    for (var off = -2; off <= 7; off++) (function (o) {
      getJSON(dayURL(o)).then(function (d) { dayCount[o] = (d.events || []).length; drawDays(); }).catch(function () {});
    })(off);
  }
  function chooseDay(off) {
    if (off === day) return;
    day = off; games = []; delete $('games').dataset.scrolled;
    drawDays(); showDay();
    $('games').innerHTML = '<div class="nogames">Loading…</div>';
    loadGames().catch(function () { $('games').innerHTML = '<div class="nogames">Couldn’t load that day. Try again.</div>'; });
  }

  function loadGames() {
    var want = day, first = firstLoad;
    return getJSON(first ? API + 'scoreboard' : dayURL(want)).then(function (d) {
      if (first) { firstLoad = false; want = day = offsetOf(d.day && d.day.date); }
      if (want !== day) return;
      var evs = d.events || [];
      dayCount[want] = evs.length; drawDays();
      if (first) showDay();
      if (!eventId) {
        var pick = null;
        if (wantTeam) pick = evs.find(function (e) { return (e.shortName || '').toUpperCase().split(/[^A-Z]+/).indexOf(wantTeam) >= 0; });
        pick = pick || evs.find(function (e) { return e.status.type.state === 'in'; })
                    || evs.find(function (e) { return e.status.type.state === 'pre'; })
                    || evs[0];
        if (pick) eventId = pick.id;
      }
      games = evs;
      drawGames();
    });
  }

  /* one tile per game tonight; tapping a tile switches the whole screen to that game */
  var games = [];
  function drawGames() {
    var nav = $('games');
    if (!games.length) { nav.innerHTML = '<div class="nogames">No NBA games on this day.</div>'; return; }
    nav.innerHTML = games.map(function (e) {
      var comp = e.competitions[0], st = e.status.type;
      var teams = comp.competitors.slice().sort(function (a, b) { return (a.homeAway === 'away' ? 0 : 1) - (b.homeAway === 'away' ? 0 : 1); });
      var started = st.state !== 'pre';
      var top = Math.max.apply(null, teams.map(function (c) { return +c.score || 0; }));
      var rows = teams.map(function (c) {
        var logo = c.team.logo || (c.team.logos && c.team.logos[0] && c.team.logos[0].href);
        var lose = st.state === 'post' && (+c.score || 0) < top;
        return '<span class="row' + (lose ? ' lose' : '') + '">' +
          (logo ? '<img alt="" src="' + esc(logo) + '">' : '<span class="ph"></span>') +
          '<span class="ab">' + esc(c.team.abbreviation) + '</span>' +
          (started ? '<span class="sc">' + esc(c.score) + '</span>' : '') + '</span>';
      }).join('');
      var when = st.shortDetail;
      if (st.state === 'pre' && !/TBD/i.test(when)) {
        var tip = new Date(e.date);

    var keys = Object.keys(best);
    $('leaders').innerHTML = keys.length ? keys.map(function (k) {
      return '<div class="lrow"><b>' + esc(best[k].who) + ' <span>' + esc(best[k].team) + '</span></b><span>' + esc(best[k].val) + ' ' + esc(k.toLowerCase()) + '</span></div>';
    }).join('') : '<div class="empty">No leaders yet.</div>';

    tick();
  }

  /* ---------- controls ---------- */
  function setDelay(v) {
    delay = Math.max(0, Math.min(90, v));
    $('dVal').textContent = delay + 's';
    try { localStorage.setItem('gn-delay', String(delay)); } catch (e) {}
    render(); tick();
  }
  $('dMinus').addEventListener('click', function () { setDelay(delay - 5); });
  $('dPlus').addEventListener('click', function () { setDelay(delay + 5); });
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-side]'); if (!b) return;
    side = b.getAttribute('data-side'); sideChosen = true; render();
  });
  $('views').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]'); if (!b) return;
    view = b.getAttribute('data-view');
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });
  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-day]'); if (b) chooseDay(+b.getAttribute('data-day'));
  });
  $('games').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (b) chooseGame(b.getAttribute('data-id'));
  });

  $('dVal').textContent = delay + 's';
  setInterval(tick, 1000);
  drawDays(); countDays();
  setInterval(function () { if (day <= 1 && games.some(function (g) { return g.status.type.state !== 'post'; })) loadGames().catch(function () {}); }, 20000);
  loadGames().then(poll).catch(function () { failing = true; tick(); setTimeout(function () { loadGames().then(poll); }, 8000); });
})();
</script>
</body>
</html>
